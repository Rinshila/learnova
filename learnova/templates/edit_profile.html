{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile - Learnova</title>
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>

<body>

    <h1>Edit Profile</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'profile' %}">Back to Profile</a>

</body>
</html>
